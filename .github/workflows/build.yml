name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci && npm audit --audit-level=high
      - run: cargo install cargo-audit --locked && cd src-tauri && cargo audit
      # gitleaks CLI (MIT); the gitleaks GitHub Action needs a paid licence for organisation repos.
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact -v .

  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: shop }
        ports: ["55432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: shop }
        ports: ["53306:3306"]
        options: --health-cmd "mysqladmin ping" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev postgresql-client default-mysql-client
      - run: npm ci && npx tsc --noEmit && npm test
      - run: |
          psql -h 127.0.0.1 -p 55432 -U postgres -d shop -q -f scripts/seed-postgres.sql
          mysql -h 127.0.0.1 -P 53306 -uroot shop < scripts/seed-mysql.sql
      - run: mkdir -p dist && cd src-tauri && QUERYBIRD_LIVE_TESTS=1 cargo test -- --test-threads=1

  bundle:
    needs: [security, test]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: querybird-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
